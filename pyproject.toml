[project]
name = "baidu_apollo_sdk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "baidu-apollo-proto==1.0.1",
    "docker>=7.1.0",
    "loguru>=0.7.3",
    "nanoid>=2.0.0",
    "networkx>=3.6.1",
    "python-dotenv>=1.2.2",
    "shapely>=2.1.2",
    "websocket-client>=1.9.0",
]

[tool.setuptools.package-data]
baidu_apollo_sdk = ["scripts/*.sh"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pylint>=4.0.5",
    "pytest>=9.0.2",
    "ruff>=0.15.12",
    "sphinx>=9.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 80

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require a running Apollo Docker container",
]
